[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "st-research-agent"
version = "0.10.0"
description = "Local research copilot for reproducible spatial transcriptomics analysis"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Academic use"}
authors = [{name = "ST Agent Project"}]
dependencies = [
  "anndata>=0.12.17,<0.13",
  "h5py>=3.15,<4",
  "httpx>=0.28,<1",
  "igraph>=1.0,<2",
  "leidenalg>=0.11,<0.13",
  "langgraph>=1.0,<2",
  "numpy>=2.4,<3",
  "pandas>=2.3,<3",
  "platformdirs>=4.3,<5",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "psutil>=7.2,<8",
  "PyYAML>=6.0,<7",
  "scanpy>=1.11.5,<1.12",
  "scikit-learn>=1.8,<2",
  "scipy>=1.16,<2",
  "typer>=0.20,<1",
]

[project.optional-dependencies]
knowledge = [
  "defusedxml>=0.7.1,<0.8",
  "beautifulsoup4>=4.12,<5",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
rag = [
  "sentence-transformers>=3,<6",
]
ui = [
  "streamlit>=1.40,<2",
  "plotly>=6.1.1,<7",
  "kaleido>=1,<2",
  "pillow>=10,<13",
]

[project.scripts]
stagent = "st_agent.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["st_agent*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests_v2"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
omit = ["src/st_agent/streamlit_app.py"]
